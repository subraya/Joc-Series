<ion-col>
  <table>

    <tr>
      <td class="title">{{question.id}}</td>
    </tr>

    <tr>
      <td (click)="play()" class="audio" [ngClass]="{'active': playing}"><img src="../../assets/images/altaveu2.png"></td>
    </tr>

    <tr>
      <td class="answer"><ion-input type="text" #txtInput placeholder="resposta" [(ngModel)]="question.guess.answer" (change)="processAnswer()"></ion-input></td>
    </tr>

    <tr>
      <td class="status {{statusColorClass()}}">{{statusText()}}</td>
    </tr>

  </table>
</ion-col>
