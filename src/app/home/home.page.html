<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Blank</ion-title>
    </ion-toolbar>
  </ion-header>

  <div id="menu">
    <ion-button fill="outline" color="medium" class="lateral" (click)="showInfo()">
      <ion-icon src="assets/icon/question.svg" slot="icon-only"></ion-icon>
    </ion-button>

    <br>
  
    <ion-button fill="outline" color="medium" class="lateral" (click)="reset()">
      <ion-icon name="refresh-outline" slot="icon-only"></ion-icon>
    </ion-button>
  </div>

  

  <div id="container">
    <ion-icon id="logo" class="{{color}}" src="assets/icon/tv.svg"></ion-icon>
    <div class="clearfix"></div>
    <ion-button (click)="start()" color="medium" fill="outline" class="main">
      Jugar
    </ion-button>
  </div>

  <div id="footer">
    <small>&copy; 2010-2021 subraya</small>
  </div>
</ion-content>
