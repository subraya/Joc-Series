<ion-col>
  <table>

    <tr>
      <td class="title">{{id}}<ion-icon name="expand-outline"></ion-icon></td>
    </tr>

    <tr>
      <td (click)="play()" class="audio" [ngClass]="{'active': playing}"><img src="../../assets/images/altaveu2.png"></td>
    </tr>

    <tr>
      <td class="answer"><ion-input type="text" placeholder="resposta" [(ngModel)]="guess.answer" (change)="validateAnswer()"></ion-input></td>
    </tr>

    <tr>
      <td class="status {{statusColorClass()}}">{{statusText()}}</td>
    </tr>

  </table>
</ion-col>
