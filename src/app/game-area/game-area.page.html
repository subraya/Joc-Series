<ion-header>
  <ion-toolbar>
    <ion-row>
      <ion-buttons>
        <ion-button expand="block" fill="outline" color="medium" (click)="goMain()">
          <ion-icon name="chevron-back-outline" slot="icon-only"></ion-icon>
        </ion-button>
      </ion-buttons>
    
      <ion-title id="qualification" *ngIf="dataReady">
        <span class="title">Encerts: </span>
        <span class="score"> {{qualification.progress}} </span>
        <span class="comment">&nbsp;{{qualification.opinion}}</span>
      </ion-title>
    </ion-row>
    <!--app-qualification *ngIf="dataReady" progress="qualification.progress" score="qualification.score" opinion="qualification.opinion"></app-qualification-->
  </ion-toolbar>
</ion-header>

<ion-content >
  <ion-row *ngIf="dataReady" [ngClass]="{'gold': gameCompleted()}">
    <app-question (onNewAnswer)="onNewAnswer($event)" *ngFor="let item of data" [id]="item.id" [guess]="item.guess" [options]="item.options" [filename]="item.filename"></app-question>
  </ion-row>
</ion-content>
