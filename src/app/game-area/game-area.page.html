<ion-header>
  <ion-toolbar>
    <ion-buttons>
      <ion-button expand="block" fill="outline" color="medium" (click)="goMain()">
        <ion-icon name="chevron-back-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-row *ngIf="dataReady">
    <app-question *ngFor="let item of data" [id]="item.id" [answer]="item.answer" [options]="item.options" [status]="item.status" [filename]="item.filename"></app-question>
  </ion-row>
</ion-content>
